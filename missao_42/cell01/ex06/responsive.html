<!DOCTYPE html>

<head>
    <title> Tabela Responsiva </title>
    <style>
        table {
        
            display: block;
            width: 100%;
            height: 100%;
            border-collapse: collapse;

        }

        td {

            border: 1px solid black;
            height: 150px;
            padding: 10px;
            vertical-align: middle;
            font-family: Arial; 
            font-size: 16px;
            }

            .primeira-celula {
            background-color: orange; 
            width: 50%;
            height: 50%;
             
            }
            .segunda-celula {
            background-color: red; 
            width: 50%
            height: 50%;
            
        }
    </style>
</head>
<body> 

    <table>
        <tr>
            <td class="primeira-celula">é nois </td>
            <td class="segunda-celula">e paia nisso </td>
        </tr>
    </table>

</body>
</html>
