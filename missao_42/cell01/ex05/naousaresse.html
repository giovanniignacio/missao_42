<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nao usar essa queria endenter o codigo </title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        
        td {
            border: 1px solid black;
            height: 150px;
            padding: 10px;
            vertical-align: middle;
            font-size: 16px;
        }

        .first-cell {
            background-color: #b9c67d; /* Tom de verde/oliva claro */
            width: 50%;
        }

        .second-cell {
            background-color: #f7bca3; /* Tom de salmão/rosa claro */
            width: 50%;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first-cell">First</td>
            <td class="second-cell">Second </td>
        </tr>
    </table>

</body>
</html>
