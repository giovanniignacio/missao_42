<!DOCTYPE html>

<head>
    <title> Tabela  </title>
    <style>
        table {
        border-collapse: collapse;

        }

        td {

            border: 1px solid black;
            height: 150px;
            padding: 10px;
            vertical-align: middle;
            font-family: Arial; font-size: 16px;
            }

            .primeira-celula {
            background-color: orange; 
            width: 200px;
            }
             .segunda-celula {
            background-color: red; 
            width: 200px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="primeira-celula">é nois </td>
            <td class="segunda-celula">e paia nisso </td>
        </tr>
    </table>
</body>
</html>
