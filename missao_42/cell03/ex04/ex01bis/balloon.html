<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Explode this balloon</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #area-balao {
            text-align: center;
        }

        #balao {
            width: 200px;
            cursor: pointer;
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" ></script>

    <div id="area-balao">
        <img id="balao" src="vermelho.jpg" alt="Balão">
    </div>
    <div style="background-color: red; width:200px; height:200px", text-align: center; ></div>

 

<script>
const $balao = $("#balao");
const cores = ["./vermelho.jpg", "./verde.png", "./azul.png"];
let indice = 0;
let crescimento = null;
let encolhimento = null;

function pararTudo() {
    clearInterval(crescimento);
    clearInterval(encolhimento);
    crescimento = null;
    encolhimento = null;
}

function explodir() {
    pararTudo();
    alert("Balao explodiu!");
    $balao.css("width", "200px").attr("src", "./vermelho.jpg");
    indice = 0;
}

// Faz o balão crescer
$balao.on("mouseenter", () => {
    pararTudo();
    crescimento = setInterval(() => {
        let tamanho = $balao.width() + 5;
        if (tamanho >= 400) {
            explodir();
            return;
        }
        $balao.width(tamanho);
    }, 50);
});

// Faz o balão diminuir
$balao.on("mouseleave", () => {
    pararTudo();
    encolhimento = setInterval(() => {
        let tamanho = $balao.width() - 5;
        if (tamanho <= 200) {
            tamanho = 200;
            clearInterval(encolhimento);
            encolhimento = null;
        }
        $balao.width(tamanho);
    }, 1000);
});

// Mudar a cor do balão
$balao.on("click", () => {
    indice = (indice + 1) % cores.length;
    $balao.attr("src", cores[indice]);
});

</script>


</body>
</html>
