<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="jquery-3.7.1.min.js"></script>
    <meta charset="UTF-8">
    <script src="jquery-3.7.1.min.js"></script>
    <title>Explode this balloon</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #area-balao {
            text-align: center;
        }

        #balao {
            width: 200px;
            cursor: pointer;
            display: block;
        }
    </style>
</head>
<body>

    <div id="area-balao">
        <img id="balao" src="vermelho.jpg" alt="Balão">
    </div>
    <div style="background-color: red; width:200px; height:200px", text-align: center; ></div>

 

<script>
    const balao = document.getElementById("balao");
    const cores = ["./vermelho.jpg", "./verde.png", "./azul.png"];
    let indice = 0;
    let crescimento = null;
    let encolhimento = null;

    function pararTudo() {
        clearInterval(crescimento);
        clearInterval(encolhimento);
        crescimento = null;
        encolhimento = null;
    }

    function explodir() {
        pararTudo();
        alert("Balao explodiu!");
        balao.style.width = "200px";
        balao.src = "./vermelho.jpg";
        indice = 0;
    }
        // faz o balao crecer
    balao.addEventListener("mouseenter", () => {
        pararTudo();

        crescimento = setInterval(() => {
            let tamanho = balao.offsetWidth + 5;

            if (tamanho >= 400) {
                tamanho = 400;
                balao.style.width = `${tamanho}px`;
                clearInterval(crescimento);
                crescimento = null;
                explodir();
                return;
            }

            balao.style.width = `${tamanho}px`;
        }, 50);
    });
            // faz o balao diminuir 
    balao.addEventListener("mouseleave", () => {
        pararTudo();

        encolhimento = setInterval(() => {
            let tamanho = balao.offsetWidth - 5;

            if (tamanho <= 200) {
                tamanho = 200;
                clearInterval(encolhimento);
                encolhimento = null;
            }

            balao.style.width = `${tamanho}px`;
        }, 1000);
    });
        // mudar a cor do balao
    balao.addEventListener("click", () => {
        indice = (indice + 1) % cores.length;
        balao.src = cores[indice];
    });
</script>


</body>
</html>
