<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="jquery-3.7.1.min.js"></script>
    <title>It’s over 9000</title>

    <style>
        body {
            background-color: black;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 15px;
            margin: auto;
        }

        .calc {
            width: 100%;
            height: 60px;
            background-color: gray;
        }
    </style>
</head>

<body>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" ></script>

    <input type="text" id="primeiro">

    <select name="selecionar" id="operador">
        <option value="+">+</option>   
        <option value="-">-</option>   
        <option value="*">*</option>   
        <option value="/">/</option>   
        <option value="%">%</option>
    </select>

    <input type="text" id="segundo">

    <!-- Adicionado id="btn" para facilitar o clique -->
    <input type="submit" id="btn" value="Try me!">

    <script>
   $(document).ready(function() {
    // Valida se é apenas número inteiro e >= 0
    function isValidInteger(str) {
        const num = Number(str);
        return !isNaN(num) && Number.isInteger(num) && num >= 0 && str.trim() !== "";
    }

    // Executa ao clicar no botão
    $('#btn').on('click', function() {
        const val1Str = $('#primeiro').val();
        const val2Str = $('#segundo').val();
        const op = $('#operador').val();

        // Requisito 6: Só inteiros >= 0, senão alert('Error :(')
        if (!isValidInteger(val1Str) || !isValidInteger(val2Str)) {
            alert('Error :(');
            return;
        }

        const n1 = parseInt(val1Str, 10);
        const n2 = parseInt(val2Str, 10);

        // Requisito 7: Divisão ou Módulo por zero
        if ((op === '/' || op === '%') && n2 === 0) {
            alert("It's over 9000!");
            console.log("It's over 9000!");
            return;
        }

        // Requisito 5: Calcula o resultado
        let res;
        switch (op) {
            case '+': res = n1 + n2; break;
            case '-': res = n1 - n2; break;
            case '*': res = n1 * n2; break;
            case '/': res = n1 / n2; break;
            case '%': res = n1 % n2; break;
        }

        // Exibe resultado
        alert(res);
        console.log(res);
    });

    // Requisito 8: Alerta a cada 30 segundos
   $(document).ready(function() {
    setInterval(function() { 
        alert('Please, use me...'); 
    }, 3000);
});


    </script>

</body>
</html>
