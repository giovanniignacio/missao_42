<!DOCTYPE html>
<html lang="pt-BR">  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To do or not to do</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: black;
            color: white;
            padding: 15px;
        }
        #botao {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .task-item {
            margin: 10px 0;
        }
        .btn-remover {
            margin-left: 10px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 2px 8px;
            cursor: pointer;
            border-radius: 3px;
        }
    </style>
</head>
<body>
        
    <div class="container">
        <button id="botao">Adicionar tarefa</button>
        <div id="ft_list"></div>
    </div>
        
    <script src="todo.js"></script>
</body>
</html>
